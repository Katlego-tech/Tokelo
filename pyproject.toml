[project]
name = "tokelo"
version = "0.1.0"
description = "Tokelo: lease checks, tamper-evident evidence and dispute dossiers for South African tenants"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false   # the functions' images copy src/tokelo; nothing is installed as a package
exclude-newer = "7 days"   # a cooldown: a package version is used only once it's a week old

[tool.ruff]
line-length = 100
target-version = "py314"
# The kit's own tools run on Python 3.11+ and are linted and tested in the kit (SecretRealm).
# Formatting them for 3.14 would break them: PEP 758's unparenthesised `except A, B:`.
extend-exclude = ["scripts/realm"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `fakes` is this repo's own test stand-ins (tests/fakes.py, on the pytest path), not a package
# from PyPI, so it sorts with the project's imports rather than above them.
known-first-party = ["tokelo", "fakes"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` too, so the lanes can share one set of stand-ins (tests/fakes.py) instead of
# each keeping its own copy of a fake S3.
pythonpath = ["src", "tests"]
# Each lane names its own test file after what it holds, so two lanes may both have a
# `test_flags.py` — the flags the `ocr` worker writes and the flags the API serves. Under the
# default import mode those collide on the module name; importlib gives each its own.
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "req(*ids): the requirements this test verifies",
    "docker: runs a container (DynamoDB Local); needs Docker",
]

[dependency-groups]
dev = [
    "boto3>=1.42.0",       # the tests talk to DynamoDB Local; the functions use the SDK too
    "pillow>=12.3.0",      # tests only: it makes the scanned and photographed sample leases
    "pypdf>=6.18.1",       # so the reader's types resolve here; the image installs them too
    "pypdfium2>=5.13.0",
    "pyright>=1.1.414",
    "pytesseract>=0.3.13", # the binary lives in the ocr image; this is only the wrapper
    "pytest>=9.1.1",
    "reportlab>=5.0.1",    # tests only: it makes the digital sample lease, from known text
    "ruff>=0.16.7",
]
# The `ocr` image is Debian's Python, not Lambda's, so it needs the runtime client and the SDK.
# The other three run on public.ecr.aws/lambda/python, which ships boto3 already.
ocr-image = [
    "awslambdaric>=4.0.3",
    "boto3>=1.42.0",
    "pillow>=12.3.0",      # preprocessing a photographed page before Tesseract sees it
    "pypdf>=6.18.1",       # the text layer and the page count (ADR-0009: try this first)
    "pypdfium2>=5.13.0",   # rendering a page that has no text layer
    "pytesseract>=0.3.13", # Tesseract 5, which the image installs from apt
]
